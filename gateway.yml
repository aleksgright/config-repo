server:
  forward-headers-strategy: framework
  port: 8080

spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

          routes:
            - id: user-accounter-swagger
              uri: lb://user-accounter
              predicates:
                - Path=/user-acc/v3/api-docs
              filters:
                - RewritePath=/user-acc/(?<segment>.*), /$\{segment}

            - id: dish-service-swagger
              uri: lb://dish-service
              predicates:
                - Path=/dish-serv/v3/api-docs
              filters:
                - RewritePath=/dish-serv/(?<segment>.*), /$\{segment}

            - id: menu-service-swagger
              uri: lb://menu-service
              predicates:
                - Path=/menu-serv/v3/api-docs
              filters:
                - RewritePath=/menu-serv/(?<segment>.*), /$\{segment}

            - id: user-accounter
              uri: lb://user-accounter
              predicates:
                - Path=/user-acc/**

            - id: dish-service
              uri: lb://dish-service
              predicates:
                - Path=/dish-serv/**

            - id: menu-service
              uri: lb://menu-service
              predicates:
                - Path=/menu-serv/**

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
    fetch-registry: true
    register-with-eureka: true

  instance:
    prefer-ip-address: true

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    disable-swagger-default-url: true
    urls:
      - name: Dish Service
        url: /dish-serv/v3/api-docs
      - name: Menu Service
        url: /menu-serv/v3/api-docs
      - name: User Accounter
        url: /user-acc/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,mappings
