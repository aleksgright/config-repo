server:
  forward-headers-strategy: framework
  port: 8080

spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

          routes:
            - id: user-accounter-route
              uri: lb://user-accounter
              predicates:
                - Path=/user-accounter/**
              filters:
                - RewritePath=/user-accounter/(?<segment>.*), /$\{segment}

            - id: dish-route
              uri: lb://dish-service
              predicates:
                - Path=/dish-service/**
              filters:
                - RewritePath=/dish-service/(?<segment>.*), /$\{segment}

            - id: menu-route
              uri: lb://menu-service
              predicates:
                - Path=/menu-service/**
              filters:
                - RewritePath=/menu-service/(?<segment>.*), /$\{segment}
  

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
    fetch-registry: true
    register-with-eureka: true

  instance:
    prefer-ip-address: true

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    disable-swagger-default-url: true
    urls:
      - name: Menu Service
        url: /menu-service/v3/api-docs
      - name: Dish Service
        url: /dish-service/v3/api-docs
      - name: User Accounter
        url: /user-accounter/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,mappings
