server:
  forward-headers-strategy: framework
  port: 8080

spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

          routes:
            - id: user-accounter
              uri: lb://user-accounter
              predicates:
                - Path=/user/**
              filters:
                - RewritePath=/user-accounter/(?<segment>.*), /$\{segment}

            - id: app
              uri: lb://app
              predicates:
                - Path=/app/**


eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
    fetch-registry: true
    register-with-eureka: true

  instance:
    prefer-ip-address: true

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    disable-swagger-default-url: true
    urls:
      - name: App Service
        url: /app/v3/api-docs
      - name: User Accounter
        url: /user/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,mappings
